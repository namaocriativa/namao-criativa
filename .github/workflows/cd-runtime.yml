name: CD API

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-api-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/namaocriativa/namao-api

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'services/platform/**'
              - 'packages/landing-kit/**'
              - 'Dockerfile'
              - 'package.json'
              - 'package-lock.json'

  build-and-push:
    name: Build and push
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Coolify
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      COOLIFY_BASE_URL: ${{ vars.COOLIFY_BASE_URL }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      COOLIFY_RUNTIME_UUID: ${{ secrets.COOLIFY_RUNTIME_UUID }}
    steps:
      - name: Redeploy API
        run: |
          set -euo pipefail
          if [ -z "${COOLIFY_RUNTIME_UUID:-}" ] || [ -z "${COOLIFY_API_TOKEN:-}" ] || [ -z "${COOLIFY_BASE_URL:-}" ]; then
            echo "Skipping Coolify deploy until COOLIFY_BASE_URL, COOLIFY_API_TOKEN and COOLIFY_RUNTIME_UUID are set."
            echo "Publish the GHCR image first, then run cloud:apply and store runtime_application_uuid as COOLIFY_RUNTIME_UUID."
            exit 0
          fi
          base="${COOLIFY_BASE_URL%/}"
          curl -fsS \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            -H "Accept: application/json" \
            "${base}/api/v1/deploy?uuid=${COOLIFY_RUNTIME_UUID}&force=true"
          echo
          echo "Coolify deploy queued for ${COOLIFY_RUNTIME_UUID}"
