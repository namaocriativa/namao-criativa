name: CD website

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-website-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      website: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.website }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            website:
              - 'apps/website/**'
              - 'cloud/lib/website-redirects.ts'
              - 'cloud/scripts/write-website-redirects.ts'
              - '.github/workflows/cd-website.yml'

  deploy:
    name: Build and deploy Pages
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WEBSITE_API_ORIGIN: ${{ vars.WEBSITE_API_ORIGIN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Write API proxy redirects
        run: npm run website:redirects -w @namao/cloud

      - name: Build
        run: npm run build -w @namao/website

      - id: cf
        name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Skipping Pages deploy until CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are set."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Cloudflare Pages
        if: steps.cf.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/website
          command: pages deploy dist --project-name=namao-website --branch=main --commit-hash=${{ github.sha }} --commit-dirty=true
