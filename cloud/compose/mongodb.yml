# MongoDB single-node replica set (rs0) for Prisma.
# Coolify Service: POST /api/v1/services with docker_compose_raw (base64).
#
# Env (set via Coolify service envs / apply script):
#   MONGO_ROOT_USERNAME
#   MONGO_ROOT_PASSWORD
#   MONGO_DATABASE

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    command:
      - "--replSet"
      - "rs0"
      - "--bind_ip_all"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD required}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-namao}
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - "--quiet"
        - "--eval"
        - "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  mongo-init:
    image: mongo:7
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "on-failure"
    entrypoint:
      - bash
      - -c
      - |
        set -e
        USER="$${MONGO_ROOT_USERNAME:-root}"
        PASS="$${MONGO_ROOT_PASSWORD}"
        HOST="mongodb:27017"
        echo "Waiting for MongoDB auth..."
        until mongosh --host "$$HOST" -u "$$USER" -p "$$PASS" --authenticationDatabase admin --quiet --eval 'db.adminCommand("ping")' >/dev/null 2>&1; do
          sleep 2
        done
        STATUS=$$(mongosh --host "$$HOST" -u "$$USER" -p "$$PASS" --authenticationDatabase admin --quiet --eval 'try { rs.status().ok } catch (e) { 0 }' || echo 0)
        if [ "$$STATUS" = "1" ]; then
          echo "Replica set rs0 already initialized"
          exit 0
        fi
        echo "Initializing replica set rs0..."
        mongosh --host "$$HOST" -u "$$USER" -p "$$PASS" --authenticationDatabase admin --quiet --eval '
          rs.initiate({
            _id: "rs0",
            members: [{ _id: 0, host: "mongodb:27017" }]
          })
        '
        echo "Replica set initiated"

volumes:
  mongodb-data:
