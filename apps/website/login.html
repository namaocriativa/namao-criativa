<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--seo-->
  </head>
  <body class="auth-body">
    <header class="site-nav">
      <a class="nav-brand" href="/">
        <img src="/logo-mark.png" alt="Namão Criativa" width="40" height="40" decoding="async" />
        <span>Namão</span>
      </a>
      <nav><a href="/register.html">Criar conta</a></nav>
    </header>
    <main class="auth-main">
      <p class="kicker">Acesso</p>
      <h1>Entrar</h1>
      <form id="login-form">
        <label>E-mail <input name="email" type="email" required autocomplete="email" /></label>
        <label>Senha <input name="password" type="password" required minlength="8" autocomplete="current-password" /></label>
        <button type="submit" id="login-btn">Entrar</button>
      </form>
      <p class="status" id="login-status"></p>
    </main>
    <footer class="site-footer site-footer--compact">
      <div class="footer-inner">
        <div class="footer-meta">
          <p>© 2026 Namão Criativa</p>
          <nav class="footer-legal" aria-label="Documentos legais">
            <a href="/termos.html">Termos de uso</a>
            <a href="/privacidade.html">Privacidade</a>
          </nav>
        </div>
      </div>
    </footer>
    <script type="module" src="/src/login.ts"></script>
  </body>
</html>
