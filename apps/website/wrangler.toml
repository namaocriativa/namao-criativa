# Cloudflare Pages — @namao/website
# Projeto criado/atualizado por `npm run cloud:website`. Deploy: .github/workflows/cd-website.yml
name = "namao-website"
compatibility_date = "2026-09-01"
pages_build_output_dir = "dist"

# Direct Upload does not copy dashboard plaintext vars onto the Function.
# Keep this in wrangler so every `pages deploy` binds the API origin.
[vars]
WEBSITE_API_ORIGIN = "https://api.namaocriativa.com.br"
