<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Criar conta — Namão Criativa</title>
    <link rel="icon" type="image/png" href="/logo-icon.png" />
    <link rel="apple-touch-icon" href="/logo-icon.png" />
    <meta name="theme-color" content="#050505" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@600;700;800&family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="auth-body">
    <header class="site-nav">
      <a class="nav-brand" href="/">
        <img src="/logo-icon.png" alt="" width="40" height="40" decoding="async" />
        <span>Namão</span>
      </a>
      <nav><a href="/login.html">Entrar</a></nav>
    </header>
    <main class="auth-main">
      <p class="kicker">Cadastro</p>
      <h1>Criar conta</h1>
      <p id="invite-hint" class="lede">A senha e o link de acesso chegam no e-mail.</p>
      <form id="register-form">
        <label>Nome <input name="name" required autocomplete="name" maxlength="120" /></label>
        <label>E-mail <input name="email" type="email" required autocomplete="email" maxlength="254" /></label>
        <label>Instagram do negócio <input name="instagram" required autocomplete="username" placeholder="@seu.negocio" maxlength="80" /></label>
        <p class="form-note">Enviamos a senha e o link de acesso para este e-mail.</p>
        <label class="legal-accept">
          <input type="checkbox" name="acceptedTerms" required />
          <span>
            Li e aceito os
            <a href="/termos.html" target="_blank" rel="noopener noreferrer">Termos de uso</a>
            e a
            <a href="/privacidade.html" target="_blank" rel="noopener noreferrer">Política de privacidade</a>.
          </span>
        </label>
        <button type="submit" id="register-btn">Criar conta</button>
      </form>
      <p class="status" id="register-status"></p>
    </main>
    <footer class="site-footer site-footer--compact">
      <div class="footer-inner">
        <div class="footer-meta">
          <p>© 2026 Namão Criativa</p>
          <nav class="footer-legal" aria-label="Documentos legais">
            <a href="/termos.html">Termos de uso</a>
            <a href="/privacidade.html">Privacidade</a>
          </nav>
        </div>
      </div>
    </footer>
    <script type="module" src="/src/register.ts"></script>
  </body>
</html>
