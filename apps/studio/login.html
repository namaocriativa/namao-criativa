<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#050505" />
    <title>Entrar · Namão Studio</title>
    <script>
      try {
        var theme = localStorage.getItem("namao_studio_theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute(
              "content",
              theme === "light" ? "#f4f4f2" : "#050505",
            );
          }
        }
      } catch (e) {}
    </script>
    <link rel="icon" href="/logo-mark.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@600;700;800&family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="auth-screen">
    <header class="topbar">
      <div class="topbar-inner">
        <a href="/login" class="brand-link">
          <img
            class="brand-logo"
            src="/logo-mark.png"
            alt=""
            width="40"
            height="40"
            decoding="async"
          />
          <h1 class="brand">
            <span class="brand-short">Namão</span>
            <span class="brand-full">Namão Studio</span>
          </h1>
        </a>
        <button
          type="button"
          class="topbar-theme"
          id="studio-theme-btn"
          aria-pressed="false"
          aria-label="Ativar tema claro"
        >
          Claro
        </button>
      </div>
    </header>
    <main class="auth-card">
      <p class="auth-kicker">Acesso interno</p>
      <h1>Entrar</h1>
      <p class="auth-hint">Só para operadores e administradores.</p>
      <form id="login-form">
        <label>
          E-mail
          <input name="email" type="email" required autocomplete="username" />
        </label>
        <label>
          Senha
          <span class="auth-password">
            <input
              name="password"
              type="password"
              required
              minlength="8"
              autocomplete="current-password"
            />
            <button
              type="button"
              class="auth-password-toggle"
              data-password-toggle
              aria-label="Mostrar senha"
              aria-pressed="false"
            >
              <svg class="auth-password-toggle__show" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <circle
                  cx="12"
                  cy="12"
                  r="3"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                />
              </svg>
              <svg class="auth-password-toggle__hide" viewBox="0 0 24 24" aria-hidden="true" hidden>
                <path
                  d="M3 3l18 18M10.6 10.6A3 3 0 0 0 13.4 13.4M7 7.3C4.3 8.8 2.5 12 2.5 12s3.6 7 9.5 7c1.7 0 3.2-.4 4.5-1.1M16.8 16.2C19.4 14.6 21.5 12 21.5 12S17.9 5 12 5c-.9 0-1.8.1-2.6.4"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </span>
        </label>
        <label class="auth-remember">
          <input
            type="checkbox"
            id="login-remember"
            name="rememberMe"
            checked
          />
          Manter-me conectado
        </label>
        <button type="submit">Entrar</button>
      </form>
      <p class="status" id="login-status"></p>
    </main>
    <script type="module" src="/src/login.ts"></script>
  </body>
</html>
