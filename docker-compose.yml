services:
  redis:
    image: redis:7-alpine
    container_name: namao-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: crawl4ai
    ports:
      - "11235:11235"
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-local-dev-crawl4ai-token}
    shm_size: 1g
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  platform:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: namao-platform
    ports:
      - "3000:3000"
    env_file:
      - services/platform/.env
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: file:./dev.db
      REDIS_URL: redis://redis:6379
      OLLAMA_URL: http://ollama:11434
      CRAWL4AI_URL: http://crawl4ai:11235
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      TSC_WATCHFILE: UsePollingDelay
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./services/platform/src:/app/services/platform/src
      - ./services/platform/prisma:/app/services/platform/prisma
      - ./services/platform/storage:/app/services/platform/storage
      - ./packages/landing-kit/src:/app/packages/landing-kit/src
      - ./leads:/app/leads
    depends_on:
      redis:
        condition: service_healthy
      crawl4ai:
        condition: service_started
      ollama:
        condition: service_started
    init: true
    restart: unless-stopped

  runtime:
    build:
      context: .
      dockerfile: services/runtime/Dockerfile
      target: development
    container_name: namao-runtime
    ports:
      - "3001:3001"
    env_file:
      - services/runtime/.env
    environment:
      NODE_ENV: development
      PORT: "3001"
      DATABASE_URL: file:./dev.db
      REDIS_URL: redis://redis:6379
      TSC_WATCHFILE: UsePollingDelay
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./services/runtime/src:/app/services/runtime/src
      - ./services/runtime/prisma:/app/services/runtime/prisma
      - ./services/platform/prisma:/app/services/platform/prisma
      - ./leads:/app/leads
      # Mantém engines Linux do Prisma Mongo gerados na imagem (evita misturar com Darwin do host)
      - runtime-mongo-generated:/app/services/runtime/src/generated
    depends_on:
      redis:
        condition: service_healthy
      platform:
        condition: service_started
    init: true
    restart: unless-stopped

volumes:
  redis-data:
  ollama-data:
  runtime-mongo-generated:
