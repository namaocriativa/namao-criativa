services:
  postgres:
    image: postgres:16-alpine
    container_name: namao-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: namao
      POSTGRES_PASSWORD: namao
      POSTGRES_DB: namao
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U namao -d namao"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: namao-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: crawl4ai
    ports:
      - "11235:11235"
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-local-dev-crawl4ai-token}
    shm_size: 1g
    restart: unless-stopped

  platform:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: namao-platform
    ports:
      - "3000:3000"
    env_file:
      - services/platform/.env
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: postgresql://namao:namao@postgres:5432/namao
      REDIS_URL: redis://redis:6379
      CRAWL4AI_URL: http://crawl4ai:11235
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      TSC_WATCHFILE: UsePollingDelay
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./services/platform/src:/app/services/platform/src
      - ./services/platform/prisma:/app/services/platform/prisma
      - ./services/platform/storage:/app/services/platform/storage
      - ./packages/landing-kit/src:/app/packages/landing-kit/src
      - ./leads:/app/leads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      crawl4ai:
        condition: service_started
    init: true
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
